title: SSH Brute Force Attack
id: ssh-brute-force-001
status: stable
description: Detects multiple failed SSH authentication attempts from the same IP in a short time window, indicating a brute force attack.
level: high
logsource:
  product: linux
  service: auth
detection:
  selection:
    status: failure
    tags|contains: ssh_failed
  condition: selection | count() > 5
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
references:
  - https://attack.mitre.org/techniques/T1110/001/
